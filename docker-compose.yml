version: "3.9"

networks:
  owasp-net:
    driver: bridge

volumes:
  dashboard-data:

services:
  # ─────────────────────────────────────────
  # DASHBOARD DE CONTROL
  # ─────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: owasp-dashboard
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker-compose:/usr/bin/docker-compose:ro
      - .:/project:ro
      - dashboard-data:/data
    environment:
      - COMPOSE_DIR=/project
      - DB_PATH=/data/progress.db
      - TRACKS_DIR=/project/tracks
      - FLAG_SECRET=${FLAG_SECRET:-dinoseclabs-default-secret}
      - AUTO_STOP_HOURS=${AUTO_STOP_HOURS:-4}
    networks:
      - owasp-net
    restart: unless-stopped

  # A01 - Broken Access Control
  a01-broken-access-control:
    build:
      context: .
      dockerfile: labs/a01-broken-access-control/Dockerfile
    container_name: owasp-a01
    ports:
      - "8001:5000"
    networks:
      - owasp-net
    environment:
      - FLAG_SECRET=${FLAG_SECRET:-dinoseclabs-default-secret}
    profiles: ["a01"]

  # A02 - Security Misconfiguration
  a02-security-misconfiguration:
    build:
      context: .
      dockerfile: labs/a02-security-misconfiguration/Dockerfile
    container_name: owasp-a02
    ports:
      - "8002:5000"
    networks:
      - owasp-net
    environment:
      - FLAG_SECRET=${FLAG_SECRET:-dinoseclabs-default-secret}
    profiles: ["a02"]

  # A03 - Software Supply Chain Failures
  a03-supply-chain:
