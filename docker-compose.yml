      context: .
      dockerfile: labs/a03-supply-chain/Dockerfile
    container_name: owasp-a03
    ports:
      - "8003:5000"
    networks:
      - owasp-net
    environment:
      - FLAG_SECRET=${FLAG_SECRET:-dinoseclabs-default-secret}
    profiles: ["a03"]

  # A04 - Cryptographic Failures
